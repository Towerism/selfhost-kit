name: App image

# Reusable (ADR-0004): builds an app's image once, runs the app's smoke scripts against it, and only then
# publishes that same image to GHCR. An app calls it from its CI, pinned by full commit SHA (never a tag):
#
#   image:
#     needs: check
#     permissions: { contents: read, packages: write }
#     uses: Towerism/selfhost-kit/.github/workflows/app-image.yml@<sha> # vX.Y.Z
#     with:
#       image-name: ghcr.io/towerism/<app>
#       smoke-scripts: |
#         test/docker/smoke.sh
#
# Tags: `edge` and `sha-<short>` from pushes to main, `pr-<n>` from pull requests of the same repository
# (fork PRs only build and smoke-test). The release tags X.Y.Z / X.Y / latest come from app-release.yml,
# on the digest this workflow outputs. amd64 only: Unraid is the only target.
on:
  workflow_call:
    inputs:
      image-name:
        description: The image to publish, e.g. ghcr.io/towerism/play-pokemon-attendance
        type: string
        required: true
      target:
        description: The Dockerfile stage to build
        type: string
        default: app
      file:
        description: The Dockerfile, relative to the repository root
        type: string
        default: Dockerfile
      context:
        description: The build context, relative to the repository root
        type: string
        default: .
      smoke-scripts:
        description: Programs to run in order, one per line, each with the built image's local tag as its argument
        type: string
        default: ''
      publish:
        description: Publish the image when the event allows it (false only builds and smoke-tests)
        type: boolean
        default: true
    outputs:
      digest:
        description: The published image's manifest digest, or empty when nothing was published
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

# bash -eo pipefail: without `shell:`, a failing command on the left of a pipe would pass.
defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Before the build, so the tested image already carries the labels it is published with.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=edge,branch=main
            type=ref,event=pr
            type=sha,enable=${{ github.event_name == 'push' }}

      # The only build: the smoke tests run on this image, and the publish step pushes this image.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: linux/amd64
          load: true
          tags: app-image:smoke-test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Each script gets /dev/null as stdin: one that reads stdin must not swallow the rest of the list.
      - name: Smoke tests
        env:
          SMOKE_SCRIPTS: ${{ inputs.smoke-scripts }}
          IMAGE: app-image:smoke-test
        run: |
          ran=0
          while IFS= read -r script; do
            script="$(printf '%s' "$script" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
            [ -z "$script" ] && continue
            case "$script" in */*) ;; *) script="./$script" ;; esac
            echo "::group::$script $IMAGE"
            "$script" "$IMAGE" </dev/null
            echo "::endgroup::"
            ran=$((ran + 1))
          done <<< "$SMOKE_SCRIPTS"
          if [ "$ran" -eq 0 ]; then
            echo "::warning title=No smoke tests::No smoke-scripts were given, so the image was not smoke-tested."
          fi

      # Fork PRs get a read-only token: they stop after the smoke tests.
      - name: Decide whether to publish
        id: publish
        env:
          PUBLISH: ${{ inputs.publish }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          enabled=false
          if [ "$PUBLISH" = true ] && { [ "$EVENT" = push ] || [ "$HEAD_REPO" = "$REPO" ]; }; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.publish.outputs.enabled == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # No rebuild: the tested image (by its ID, not the tag a smoke script could move) is pushed under
      # one per-commit or per-PR tag, and the other tags name the digest that push reported.
      # --prefer-index=false: otherwise buildx (>= 0.13) wraps a single image manifest in a new one-entry
      # index, and the tag would name that index's digest instead of the one this job outputs.
      - name: Publish to GHCR
        id: push
        if: steps.publish.outputs.enabled == 'true'
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          IMAGE_NAME: ${{ inputs.image-name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then tags+=("$tag"); fi
          done <<< "$TAGS"
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::error::The metadata step produced no image tags; nothing was published."
            exit 1
          fi
          primary="${tags[0]}"
          for tag in "${tags[@]}"; do
            case "$tag" in *:sha-*) primary="$tag" ;; esac
          done
          docker tag "$IMAGE_ID" "$primary"
          if ! pushed="$(docker push "$primary")"; then
            printf '%s\n' "$pushed"
            echo "::error::docker push $primary failed; nothing was published."
            exit 1
          fi
          printf '%s\n' "$pushed"
          digest="$(printf '%s\n' "$pushed" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)"
          if [ -z "$digest" ]; then
            echo "::error::docker push $primary reported no digest; nothing else was tagged."
            exit 1
          fi
          for tag in "${tags[@]}"; do
            if [ "$tag" != "$primary" ]; then
              docker buildx imagetools create --prefer-index=false --tag "$tag" "$IMAGE_NAME@$digest"
            fi
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
