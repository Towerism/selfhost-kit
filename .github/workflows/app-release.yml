name: App release

# Reusable (ADR-0004, ADR-0005): releases an app from Conventional Commits on the image its CI tested.
# A dry run of semantic-release (with `@towerism/selfhost-kit/release-config`) writes the next version;
# this job tags the tested digest X.Y.Z / X.Y / latest, and only then pushes the git tag and the GitHub
# Release, so a Release never exists without its image. Nothing is committed back to main. An app calls it
# only on pushes to main, after its check, e2e and image jobs, pinned by full commit SHA:
#
#   release:
#     needs: [check, e2e, image]
#     if: github.event_name == 'push' && github.ref == 'refs/heads/main'
#     permissions: { contents: write, packages: write }
#     uses: Towerism/selfhost-kit/.github/workflows/app-release.yml@<sha> # vX.Y.Z
#     with:
#       image-name: ghcr.io/towerism/<app>
#       digest: ${{ needs.image.outputs.digest }}
#
# Rollback: pin the previous X.Y.Z tag on Unraid, then revert the commit (which releases a new patch).
on:
  workflow_call:
    inputs:
      image-name:
        description: The image app-image.yml published, e.g. ghcr.io/towerism/play-pokemon-attendance
        type: string
        required: true
      digest:
        description: The digest app-image.yml output; the release tags exactly this image
        type: string
        required: true

permissions:
  contents: read

# bash -eo pipefail: without `shell:`, a failing command on the left of a pipe would pass.
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the git tag and the GitHub Release
      packages: write # the X.Y.Z, X.Y and latest image tags
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Writes $RUNNER_TEMP/release-version only when a release is due. Writes nothing when nothing
      # releasable landed, or when main has moved on: the newer run releases.
      - name: Next version (dry run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release --dry-run

      - name: Decide whether to release
        id: next
        run: |
          if [ -s "$RUNNER_TEMP/release-version" ]; then
            echo "version=$(cat "$RUNNER_TEMP/release-version")" >> "$GITHUB_OUTPUT"
          else
            echo "No release due."
          fi

      # Only the run for main's current head releases: if main moved after the dry run, the real run would
      # push no git tag, and the image would carry a version with no release. The newer commit's run
      # releases instead. Through the API with the job token, because the caller's repo may be private.
      - name: Check that main hasn't moved on
        id: head
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$remote" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $remote, not $GITHUB_SHA: the newer commit's run releases."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.next.outputs.version != '' && steps.head.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Before the git tag, so a GitHub Release never exists without its image. --prefer-index=false keeps
      # buildx (>= 0.13, as on ubuntu-24.04) from wrapping an image manifest in a new index, and each tag is
      # then checked to name exactly the digest the image job tested.
      - name: Tag the image X.Y.Z, X.Y, latest
        if: steps.next.outputs.version != '' && steps.head.outputs.current == 'true'
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          VERSION: ${{ steps.next.outputs.version }}
          DIGEST: ${{ inputs.digest }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "::error::The image job published no digest; refusing to release $VERSION."
            exit 1
          fi
          tags=("$IMAGE_NAME:$VERSION" "$IMAGE_NAME:${VERSION%.*}" "$IMAGE_NAME:latest")
          docker buildx imagetools create --prefer-index=false \
            --tag "${tags[0]}" --tag "${tags[1]}" --tag "${tags[2]}" \
            "$IMAGE_NAME@$DIGEST"
          for tag in "${tags[@]}"; do
            manifest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}')"
            # The descriptor's own digest is the top-level one; an index lists its entries' digests deeper in.
            found="$(printf '%s\n' "$manifest" | sed -n 's/^  "digest": "\(sha256:[0-9a-f]\{64\}\)",\{0,1\}$/\1/p')"
            if [ "$found" != "$DIGEST" ]; then
              echo "::error::$tag names ${found:-no digest}, not the tested $DIGEST. The git tag and Release were not created, but $VERSION, ${VERSION%.*} and latest were already moved: re-pin the previous X.Y.Z on Unraid until this is fixed."
              exit 1
            fi
            echo "$tag names $DIGEST."
          done

      - name: Git tag and GitHub Release
        if: steps.next.outputs.version != '' && steps.head.outputs.current == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release

      # semantic-release exits 0 without tagging when main moved after the check above, so a missing tag
      # would otherwise pass silently while the image already carries the version.
      - name: Check the git tag
        if: steps.next.outputs.version != '' && steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq '.object.type + " " + .object.sha')" || ref=""
          sha="${ref#* }"
          if [ "${ref%% *}" = tag ]; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)" || sha=""
          fi
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::The image was tagged $VERSION, ${VERSION%.*} and latest, but no git tag v$VERSION points at $GITHUB_SHA. Check those image tags by hand: latest may name an unreleased image until the next release."
            exit 1
          fi
          echo "v$VERSION points at $GITHUB_SHA."
