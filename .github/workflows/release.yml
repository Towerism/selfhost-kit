name: Release

# Runs after CI succeeds on a push to main, and publishes the dist/ that CI built and tested.
# This file is npm's trusted publisher for @towerism/selfhost-kit (ADR-0003): keep its name.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: npm
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # tags and the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
      actions: read # the dist artifact of the CI run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      # Only the run for main's current head releases. An older run stops here, and the newer
      # commit's own run releases everything since the last tag.
      - name: Check that main hasn't moved on
        id: head
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $remote, not $HEAD_SHA: the newer commit's run will release."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in the publishing job: it installs from the lockfile alone.
      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - if: steps.head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # semantic-release pushes the tag before it publishes, so an npm that can't do OIDC (below 11.5.1)
      # must stop the job here, not at `npm publish`.
      - if: steps.head.outputs.current == 'true'
        run: node scripts/check-npm-trusted-publishing.mjs
      - if: steps.head.outputs.current == 'true'
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
