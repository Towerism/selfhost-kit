name: Release

# Runs after CI succeeds on a push to main, and publishes the dist/ that CI built and tested.
# It publishes to the Gitea npm registry with GITEA_PACKAGE_TOKEN (ADR-0009). Until the CI move, this
# copy is the only one that releases.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # tags and the GitHub Release
      actions: read # the dist artifact of the CI run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      # Only the run for main's current head releases. An older run stops here, and the newer
      # commit's own run releases everything since the last tag.
      - name: Check that main hasn't moved on
        id: head
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote" = "$HEAD_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at $remote, not $HEAD_SHA: the newer commit's run will release."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.current == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in the publishing job: it installs from the lockfile alone.
      - if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - if: steps.head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # npm reads this file for the publish. The token line names the variable, so the file holds no
      # secret: npm expands ${GITEA_PACKAGE_TOKEN} from the step's environment when it publishes.
      - name: Point npm at the Gitea registry
        if: steps.head.outputs.current == 'true'
        run: |
          userconfig="$RUNNER_TEMP/npmrc"
          {
            echo '@towerism:registry=https://vcs.martinfrackerjr.com/api/packages/towerism/npm/'
            echo '//vcs.martinfrackerjr.com/api/packages/towerism/npm/:_authToken=${GITEA_PACKAGE_TOKEN}'
          } > "$userconfig"
          echo "NPM_CONFIG_USERCONFIG=$userconfig" >> "$GITHUB_ENV"
      # semantic-release pushes the tag before it publishes. A token the registry refuses must stop the
      # job here, so the probe is a write request with the body {}: a write-scoped token reaches the upload
      # handler, which refuses {} as an invalid package with 400, and a read-only or unknown token gets 401 or
      # 403. An empty body would get 500, because the handler cannot parse it. Nothing is written.
      - name: Check the publish token can write
        if: steps.head.outputs.current == 'true'
        env:
          GITEA_PACKAGE_TOKEN: ${{ secrets.GITEA_PACKAGE_TOKEN }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X PUT -H "Authorization: Bearer $GITEA_PACKAGE_TOKEN" -H 'Content-Type: application/json' --data-binary '{}' https://vcs.martinfrackerjr.com/api/packages/towerism/npm/@towerism%2fselfhost-kit)"
          if [ "$code" != 400 ]; then
            echo "::error title=Publish token refused::The registry answered $code to the write probe, expected 400. Nothing was tagged or published." >&2
            exit 1
          fi
      - if: steps.head.outputs.current == 'true'
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEA_PACKAGE_TOKEN: ${{ secrets.GITEA_PACKAGE_TOKEN }}
